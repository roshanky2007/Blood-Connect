<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – BloodConnect</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body style="background-color: #F1F5F9; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Minimal Header -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span>Blood<span class="accent">Connect</span></span>
            </a>
            <div class="nav-actions">
                <span style="font-size: 0.875rem; color: var(--text-secondary);">Don't have an account?</span>
                <a href="register.html" class="btn btn-outline btn-sm">Register</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
        <div style="width: 100%; max-width: 440px;">
            <div class="card" style="box-shadow: var(--shadow-xl); border-radius: var(--radius-lg);">
                <div class="card-body" style="padding: 2.25rem;">
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <div style="width: 52px; height: 52px; border-radius: var(--radius-full); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.35rem;">Welcome Back</h2>
                        <p style="font-size: 0.875rem; color: var(--text-secondary);">Sign in to access your dashboard and manage blood requests.</p>
                    </div>

                    <!-- Demo Credentials for Quick Testing -->
                    <div style="background-color: var(--bg-main); border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem;">
                        <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 0.5rem; text-align: center;">
                            Demo Test Accounts (Click to Fill)
                        </div>
                        <div style="display: flex; gap: 0.5rem; justify-content: center;">
                            <button type="button" class="btn btn-secondary btn-sm" data-demo-role="admin" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">Admin</button>
                            <button type="button" class="btn btn-secondary btn-sm" data-demo-role="donor" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">Donor</button>
                            <button type="button" class="btn btn-secondary btn-sm" data-demo-role="requester" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">Requester</button>
                        </div>
                    </div>

                    <form id="login-form">
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address <span class="required">*</span></label>
                            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email" />
                        </div>

                        <div class="form-group">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                                <label class="form-label" for="password" style="margin: 0;">Password <span class="required">*</span></label>
                            </div>
                            <div class="input-password-wrapper">
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
                                <button type="button" class="toggle-pwd" id="toggle-login-password" title="Show/Hide Password" aria-label="Toggle password visibility">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                            Sign In to Account
                        </button>
                    </form>

                    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
                        New to BloodConnect? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create an account</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            AuthApp.initLogin();
        });
    </script>
</body>
</html>
