# ========================================================
# BloodConnect Application Configuration
# ========================================================

app.name=BloodConnect
app.version=1.0.0
app.context=/BloodConnect
app.port=8080

# Database Configuration (MySQL / MariaDB)
# Local development uses localhost:3306 by default.
# For Production (Render / Cloud), configure environment variables:
#   Option 1 (Individual Host/Credentials):
#     DB_HOST=your-mysql-hostname
#     DB_PORT=3306
#     DB_NAME=bloodconnect_db
#     DB_USER=your-db-user
#     DB_PASSWORD=your-db-password
#
#   Option 2 (Single URL):
#     DATABASE_URL=mysql://user:password@hostname:3306/bloodconnect_db
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/bloodconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&autoReconnect=true
db.user=root
db.password=

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxTotal=20

# Zero-Config Fallback (Set DB_FALLBACK_H2=false in production once MySQL is connected)
db.fallback.h2=true
