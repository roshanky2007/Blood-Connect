# ========================================================
# BloodConnect Application Configuration
# ========================================================

app.name=BloodConnect
app.version=1.0.0
app.context=/BloodConnect
app.port=8080

# Database Configuration (MySQL / MariaDB)
# Production credentials MUST be provided via Environment Variables:
#   Option 1: DATABASE_URL=mysql://user:pass@host:3306/bloodconnect_db
#   Option 2: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   Option 3: DB_URL, DB_USER, DB_PASSWORD
# Environment variables will override any values configured here.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/bloodconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxTotal=20

# Zero-Config Fallback (Set to false on production/Render via DB_FALLBACK_H2=false)
db.fallback.h2=true
